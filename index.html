<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alight Motion Pro - Premium Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        mono: {
                            base: '#000000',
                            secondary: '#0A0A0A',
                            card: '#111111',
                            border: '#252525',
                            primary: '#FFFFFF',
                            secondarytext: '#A0A0A0',
                            muted: '#666666',
                            accent: '#D9D9D9',
                            hover: '#FFFFFF',
                        }
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 4s infinite ease-in-out',
                        'float': 'float 6s infinite ease-in-out',
                        'shimmer': 'shimmer 3s infinite linear',
                        'modal-pop': 'modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'glow-pulse': 'glowPulse 1.5s ease-in-out',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 25px rgba(217, 217, 217, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.05)' },
                            '50%': { boxShadow: '0 0 50px rgba(217, 217, 217, 0.1), inset 0 1px 2px rgba(255, 255, 255, 0.1)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' }
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        },
                        modalPop: {
                            '0%': { transform: 'scale(0.9)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        glowPulse: {
                            '0%, 100%': { boxShadow: '0 0 10px rgba(217, 217, 217, 0.3)' },
                            '50%': { boxShadow: '0 0 30px rgba(217, 217, 217, 0.6)' },
                        },
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .liquid-glass {
                background: rgba(17, 17, 17, 0.95);
                backdrop-filter: blur(24px) saturate(100%);
                -webkit-backdrop-filter: blur(24px) saturate(100%);
                border: 1px solid #252525;
            }
            .glass-input {
                background: #0A0A0A;
                border: 1px solid #252525;
                backdrop-filter: blur(12px);
                transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .glass-input:focus {
                border-color: #D9D9D9;
                box-shadow: 0 0 25px rgba(217, 217, 217, 0.1), inset 0 0 10px rgba(255, 255, 255, 0.05);
                outline: none;
            }
            .btn-liquid {
                background: linear-gradient(135deg, #D9D9D9 0%, #A0A0A0 100%);
                box-shadow: 0 10px 35px rgba(217, 217, 217, 0.15), inset 0 1px 2px rgba(255, 255, 255, 0.5);
                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                position: relative;
                overflow: hidden;
            }
            .btn-liquid::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 0;
                height: 0;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.3);
                transform: translate(-50%, -50%);
                transition: width 0.6s, height 0.6s;
            }
            .btn-liquid:hover::before {
                width: 300px;
                height: 300px;
            }
            .btn-liquid:hover {
                background: linear-gradient(135deg, #FFFFFF 0%, #D9D9D9 100%);
                transform: translateY(-2px);
                box-shadow: 0 15px 45px rgba(255, 255, 255, 0.2), inset 0 1px 3px rgba(255, 255, 255, 0.8);
            }
            .shimmer-text {
                background: linear-gradient(90deg, #FFFFFF 0%, #A0A0A0 40%, #FFFFFF 80%);
                background-size: 200% 100%;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                animation: shimmer 3s infinite linear;
            }
        }
    </style>
</head>
<body class="bg-mono-base text-mono-primary font-sans selection:bg-mono-accent selection:text-mono-base min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- CANVAS BACKGROUND PARTICLE SYSTEM -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <canvas id="bgCanvas" class="w-full h-full block"></canvas>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_30%,rgba(217,217,217,0.03),transparent_70%)]"></div>
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_80%_80%,rgba(217,217,217,0.02),transparent_50%)]"></div>
        <div class="absolute inset-0 bg-[radial-gradient(rgba(217,217,217,0.02)_1px,transparent_1px)] [background-size:28px_28px] opacity-30"></div>
    </div>

    <!-- MAIN LOGIN CONTAINER -->
    <main class="relative z-10 w-full max-w-md">
        
        <!-- LOGIN CARD -->
        <div class="liquid-glass rounded-[32px] p-7 sm:p-9 border border-mono-border relative overflow-hidden animate-pulse-glow">
            
            <!-- Accent Lines -->
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-mono-accent/40 to-transparent"></div>
            <div class="absolute bottom-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-mono-border to-transparent"></div>

            <!-- HEADER BRANDING -->
            <div class="text-center space-y-4 mb-8">
                <div class="relative mx-auto w-fit animate-float">
                    <div class="absolute -inset-2 bg-gradient-to-tr from-mono-accent/20 via-transparent to-transparent rounded-3xl blur-lg"></div>
                    <div class="relative overflow-hidden rounded-2xl border border-mono-border shadow-2xl">
                        <img src="https://files.catbox.moe/wqq1x5.jpg" alt="Alight Motion VIP" class="block max-w-full h-auto" style="width: auto; height: auto;" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'w-24 h-24 bg-mono-secondary rounded-2xl border border-mono-border flex items-center justify-center text-mono-primary font-bold\'>AM VIP</div>';">
                    </div>
                </div>

                <div>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-mono-secondary border border-mono-border text-[10px] font-mono tracking-widest text-mono-secondarytext uppercase mb-2">
                        <span class="w-1.5 h-1.5 rounded-full bg-mono-accent animate-ping"></span>
                        <span>Premium Access</span>
                    </div>
                    <h1 class="text-3xl font-extrabold tracking-tight shimmer-text">
                        Welcome Back
                    </h1>
                    <p class="text-xs text-mono-secondarytext mt-2 font-normal leading-relaxed">
                        Login untuk mengakses <span class="text-mono-primary font-semibold">Alight Motion Pro VIP</span>
                    </p>
                </div>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- Username Input -->
                <div>
                    <label class="block text-[11px] font-semibold text-mono-secondarytext uppercase tracking-wider mb-2">
                        Username / Email
                    </label>
                    <div class="relative group">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-mono-muted text-xs transition-colors group-focus-within:text-mono-accent"></i>
                        <input type="text" id="username" required placeholder="Masukkan username" 
                               class="w-full glass-input text-mono-primary text-xs rounded-xl pl-10 pr-4 py-3.5 placeholder:text-mono-muted font-mono">
                    </div>
                </div>

                <!-- License Key Input -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-[11px] font-semibold text-mono-secondarytext uppercase tracking-wider">
                            License Key
                        </label>
                        <a href="https://t.me/k_shie" target="_blank" class="text-[10px] font-mono text-mono-muted hover:text-mono-accent transition-colors">
                            <i class="fa-brands fa-telegram mr-1"></i>Get Key
                        </a>
                    </div>
                    <div class="relative group">
                        <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-mono-muted text-xs transition-colors group-focus-within:text-mono-accent"></i>
                        <input type="text" id="licenseKey" required placeholder="AM-XXXX-2026" 
                               class="w-full glass-input text-mono-primary text-xs font-mono tracking-widest rounded-xl pl-10 pr-4 py-3.5 placeholder:text-mono-muted uppercase">
                    </div>
                </div>

                <!-- Login Button Liquid -->
                <button type="submit" id="loginBtn" 
                        class="w-full btn-liquid text-mono-base py-4 rounded-xl text-xs font-extrabold tracking-wider uppercase flex items-center justify-center gap-2">
                    <span>Login to VIP</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>

                <!-- Divider -->
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-mono-border"></div>
                    </div>
                    <div class="relative flex justify-center text-[10px]">
                        <span class="px-3 bg-mono-base text-mono-muted font-mono uppercase tracking-wider">or login with</span>
                    </div>
                </div>

                <!-- Telegram Login Button -->
                <button type="button" onclick="loginWithTelegram()" 
                        class="w-full glass-input text-mono-primary py-3.5 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-mono-card transition-all">
                    <i class="fa-brands fa-telegram text-mono-accent text-lg"></i>
                    Login dengan Telegram
                </button>
            </form>

            <!-- FOOTER INFO -->
            <div class="mt-6 pt-4 border-t border-mono-border flex items-center justify-between text-[10px] text-mono-muted font-mono">
                <span class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-mono-accent animate-pulse"></span>
                    SECURE CONNECTION
                </span>
                <span class="flex items-center gap-2">
                    <i class="fa-brands fa-telegram text-mono-accent"></i>
                    <span class="text-mono-muted">Support:</span>
                    <a href="https://t.me/k_shie" target="_blank" class="text-mono-primary font-semibold hover:text-mono-accent transition-colors">@k_shie</a>
                </span>
            </div>
            <div class="mt-2 text-center text-[9px] text-mono-muted font-mono tracking-wider">
                © 2026 Alight Motion VIP • by <span class="text-mono-secondarytext">k_shie</span>
            </div>

        </div>

    </main>

    <!-- LOADING OVERLAY -->
    <div id="loadingOverlay" class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/90 backdrop-blur-2xl hidden opacity-0 transition-opacity duration-300">
        <div class="liquid-glass max-w-sm w-full rounded-3xl p-6 border border-mono-border text-center space-y-5 relative overflow-hidden">
            <div class="w-14 h-14 mx-auto rounded-full border-2 border-mono-border border-t-mono-accent animate-spin flex items-center justify-center">
                <i class="fa-solid fa-lock text-mono-primary text-sm"></i>
            </div>
            <div>
                <h3 id="loadingTitle" class="text-sm font-bold text-mono-primary mb-1 font-mono">Authenticating...</h3>
                <p id="loadingSub" class="text-xs text-mono-secondarytext font-mono">Verifying your credentials...</p>
            </div>
            <div class="w-full bg-mono-secondary rounded-full h-1.5 overflow-hidden border border-mono-border">
                <div id="loadingBar" class="bg-mono-accent h-full w-0 transition-all duration-300"></div>
            </div>
        </div>
    </div>

    <!-- ERROR MODAL -->
    <div id="errorModal" class="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/95 backdrop-blur-3xl hidden opacity-0 transition-opacity duration-300">
        <div class="liquid-glass max-w-sm w-full rounded-[32px] p-7 border border-mono-border text-center space-y-5 relative overflow-hidden animate-modal-pop">
            
            <div class="w-16 h-16 mx-auto rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-500 text-2xl shadow-2xl">
                <i class="fa-solid fa-circle-xmark"></i>
            </div>

            <div class="space-y-1">
                <h3 class="text-xl font-extrabold text-mono-primary tracking-tight">Login Failed</h3>
                <p id="errorMessage" class="text-xs text-mono-secondarytext leading-relaxed">
                    Invalid credentials. Please try again.
                </p>
            </div>

            <button onclick="closeErrorModal()" class="w-full btn-liquid text-mono-base py-3.5 rounded-xl text-xs font-bold uppercase tracking-wider">
                Try Again
            </button>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const TELEGRAM_BOT_TOKEN = '8888138725:AAEJvZWqJa-AYbUop6AtayHG74vfZJZDmb4';
        const TELEGRAM_BOT_USERNAME = '@alightPremk_shieBot';
        const ADMIN_CHAT_ID = '6010652605';

        // ==================== DATABASE (LocalStorage) ====================
        class VIPDatabase {
            constructor() {
                this.initializeDatabase();
            }

            initializeDatabase() {
                if (!localStorage.getItem('vip_users')) {
                    localStorage.setItem('vip_users', JSON.stringify([]));
                }
                if (!localStorage.getItem('vip_sessions')) {
                    localStorage.setItem('vip_sessions', JSON.stringify([]));
                }
            }

            getAllUsers() {
                return JSON.parse(localStorage.getItem('vip_users') || '[]');
            }

            saveUsers(users) {
                localStorage.setItem('vip_users', JSON.stringify(users));
            }

            getUserByLicenseKey(licenseKey) {
                const users = this.getAllUsers();
                return users.find(u => u.licenseKey === licenseKey);
            }

            generateLicenseKey() {
                const prefix = 'AM';
                const random = Math.random().toString(36).substring(2, 8).toUpperCase();
                const year = new Date().getFullYear();
                return `${prefix}-${random}-${year}`;
            }

            verifyLicenseKey(licenseKey) {
                const user = this.getUserByLicenseKey(licenseKey);
                if (user && user.isActive) {
                    return { success: true, user };
                }
                return { success: false, message: 'License key tidak valid' };
            }

            updateLastLogin(userId) {
                const users = this.getAllUsers();
                const userIndex = users.findIndex(u => u.userId === userId);
                if (userIndex !== -1) {
                    users[userIndex].lastLogin = new Date().toISOString();
                    this.saveUsers(users);
                }
            }

            createSession(userId, userData) {
                const sessions = JSON.parse(localStorage.getItem('vip_sessions') || '[]');
                const sessionId = `session_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
                
                const session = {
                    sessionId,
                    userId,
                    username: userData.username,
                    createdAt: new Date().toISOString(),
                    expiresAt: new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString(),
                    userData
                };
                
                sessions.push(session);
                localStorage.setItem('vip_sessions', JSON.stringify(sessions));
                return session;
            }
        }

        const db = new VIPDatabase();

        // ==================== CANVAS BACKGROUND ====================
        (function initBgCanvas() {
            const canvas = document.getElementById('bgCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = [];
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.3 + 0.05,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(217, 217, 217, ${p.alpha})`;
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const p2 = particles[j];
                        const dx = p.x - p2.x;
                        const dy = p.y - p2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.strokeStyle = `rgba(217, 217, 217, ${0.03 * (1 - dist / 120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(draw);
            }

            draw();
        })();

        // ==================== LOGIN FUNCTIONS ====================
        function showLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.remove('hidden');
            setTimeout(() => loadingOverlay.classList.remove('opacity-0'), 10);
        }

        function hideLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('opacity-0');
            setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
        }

        function showError(message) {
            document.getElementById('errorMessage').innerText = message;
            
            const errorModal = document.getElementById('errorModal');
            errorModal.classList.remove('hidden');
            setTimeout(() => errorModal.classList.remove('opacity-0'), 10);
        }

        function closeErrorModal() {
            const errorModal = document.getElementById('errorModal');
            errorModal.classList.add('opacity-0');
            setTimeout(() => errorModal.classList.add('hidden'), 300);
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const licenseKey = document.getElementById('licenseKey').value.toUpperCase();
            
            showLoading();

            const loadingBar = document.getElementById('loadingBar');
            const loadingTitle = document.getElementById('loadingTitle');
            const loadingSub = document.getElementById('loadingSub');
            
            const steps = [
                { pct: '30%', title: 'Authenticating...', sub: 'Verifying your credentials...' },
                { pct: '60%', title: 'Checking License...', sub: 'Validating VIP membership...' },
                { pct: '90%', title: 'Loading Dashboard...', sub: 'Preparing your workspace...' },
                { pct: '100%', title: 'Access Granted!', sub: 'Redirecting to dashboard...' }
            ];

            let stepIdx = 0;
            const interval = setInterval(() => {
                if (stepIdx < steps.length) {
                    loadingBar.style.width = steps[stepIdx].pct;
                    loadingTitle.innerText = steps[stepIdx].title;
                    loadingSub.innerText = steps[stepIdx].sub;
                    stepIdx++;
                } else {
                    clearInterval(interval);
                    
                    // Verifikasi license key
                    const result = db.verifyLicenseKey(licenseKey);
                    
                    setTimeout(() => {
                        if (result.success) {
                            // Update last login
                            db.updateLastLogin(result.user.userId);
                            
                            // Buat session
                            const session = db.createSession(result.user.userId, result.user);
                            
                            // Simpan session di localStorage
                            localStorage.setItem('vip_session', JSON.stringify({
                                session,
                                user: result.user
                            }));
                            
                            // Redirect ke dashboard
                            window.location.href = 'dashboard.html';
                        } else {
                            hideLoading();
                            showError(result.message);
                        }
                    }, 300);
                }
            }, 800);
        }

        function loginWithTelegram() {
            const telegramUrl = `https://t.me/${TELEGRAM_BOT_USERNAME}?start=login`;
            window.open(telegramUrl, '_blank');
            showError('Buka bot Telegram dan ketik /start untuk mendapatkan license key');
        }

        // ==================== CHECK EXISTING SESSION ====================
        function checkExistingSession() {
            const sessionData = localStorage.getItem('vip_session');
            if (sessionData) {
                const { session, user } = JSON.parse(sessionData);
                const expiresAt = new Date(session.expiresAt);
                
                if (expiresAt > new Date()) {
                    // Session masih valid, redirect ke dashboard
                    window.location.href = 'dashboard.html';
                    return true;
                } else {
                    // Session expired
                    localStorage.removeItem('vip_session');
                }
            }
            return false;
        }

        // Cek session saat halaman load
        window.addEventListener('DOMContentLoaded', () => {
            checkExistingSession();
        });
    </script>
</body>
</html>
